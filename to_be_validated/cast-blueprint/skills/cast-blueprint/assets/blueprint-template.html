  return ASK_IDX = I;
}
const ASK_STOP = new Set("a an and are as at be by can could do does for from has have how i if in is it its me my of on or our should so that the their them there these this to was we what when where which who why will with would you your about tell show list give any all there's what's".split(" "));
const ASK_SYN = { promo:["promotion","coupon","discount"], promotion:["promo","coupon","discount"], discount:["promo","promotion"], stock:["inventory","availability"], inventory:["stock"],
  vulnerability:["cve"], cve:["vulnerability"], security:["cve","xss","vulnerability"], bug:["defect","clarification","inconsistent"], defect:["bug","inconsistent"], card:["payment","pci"],
  pay:["payment"], payment:["pay","stripe"], tax:["taxes"], email:["notification","mail"], ship:["shipping"], shipping:["ship"], login:["sign","sign-in"], cart:["basket"], order:["checkout"], checkout:["order"] };
const askStem = w => w.replace(/(ies)$/,"y").replace(/(ing|ed|es|s)$/,"").replace(/[^a-z0-9-]/g,"");
function askTerms(q){
  const words = q.toLowerCase().replace(/[^a-z0-9\s-]/g," ").split(/\s+/).filter(w=>w && !ASK_STOP.has(w));
  const out = new Set(); words.forEach(w=>{ out.add(askStem(w)); (ASK_SYN[w]||ASK_SYN[askStem(w)]||[]).forEach(s=>out.add(askStem(s))); });
  return [...out].filter(w=>w.length>1);
}
function askSearch(q, kinds, n=5){
  const t = askTerms(q); if (!t.length) return [];
  return askIndex().filter(x=>!kinds || kinds.includes(x.kind))
    .map(x=>({ x, s: t.reduce((a,w)=>a + (x.tHay.includes(w)?3:0) + (x.hay.includes(w)?1:0), 0) }))
    .filter(r=>r.s>1).sort((a,b)=>b.s-a.s).map(r=>r.x).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,n);
}

/* ---------- answers ---------- */
const askItem = x => ({ kind:x.kind, id:x.id, title:x.title, text:x.text, ev:x.ev });
const K_LABEL = { rule:"Business rule", fr:"Requirement", clar:"Clarification", debt:"Debt item", oss:"Open-source component", wp:"Work package", story:"User story", tobe:"To-be rule", deliv:"Deliverable", sys:"System" };
const $k = v => "$"+Math.round(v/1000).toLocaleString()+"K";
function bpAnswer(q){
  const s = q.toLowerCase(), idx = askIndex(), find = id => idx.find(x=>x.id.toLowerCase()===id.toLowerCase());
  const idm = q.match(/\b(BR-[A-Z]{2}-\d{3}|BR-TB-N\d{2}|C-\d{2}|TD-\d{2}|WP-\d{2}|FR-N?\d{2,3}|CC-US-\d{2})\b/i);
  if (idm) { const x = find(idm[1]); if (x) return { lead:`<b>${x.id}</b> is a ${K_LABEL[x.kind].toLowerCase()}: ${esc(x.title)}.`, items:[askItem(x)], follow:askFollow(x.kind) }; }

  if (/cloud.?(blocker|readiness|ready)|blocker/.test(s)) { const xs = idx.filter(x=>x.kind==="debt" && x.theme==="Cloud readiness");
    return { lead:`CAST found ${xs.length} cloud-readiness debt items. None needs a rewrite; each maps to a managed service in the Target State.`, leadEv:["cloud"], items:xs.map(askItem), follow:["What would the target architecture look like?","What would it cost to run?"] }; }

  if (/without (a |an )?(library )?upgrade|go away/.test(s) && /cve|vulnerab/.test(s)) { const r = idx.filter(x=>x.kind==="oss" && x.action!=="upgrade");
    return { lead:`${r.reduce((a,x)=>a+x.cves.length,0)} CVEs in ${r.length} components are handled without a library upgrade — removed, retired by the target state, rebuilt on a supported runtime, or verified first.`, items:r.map(askItem), follow:["Which components have critical CVEs?"] }; }

  if (/cve|vulnerab|open.?source|librar|dependenc(y|ies) (risk|upgrade)/.test(s)) {
    const sev = {C:0,H:0,M:0,L:0,U:0}; OSS.forEach(o=>o[3].forEach(c=>sev[c[1]]++)); const tot = Object.values(sev).reduce((a,b)=>a+b,0);
    const crit = idx.filter(x=>x.kind==="oss" && x.cves.some(c=>c[1]==="C"));
    return { lead:`${tot} CVEs across ${OSS.length} components: ${sev.C} critical, ${sev.H} high, ${sev.M} medium${sev.L?`, ${sev.L} low`:""}. Components with a critical CVE:`, leadEv:["cve"], items:crit.map(askItem), follow:["Which CVEs go away without an upgrade?","What should we fix first?"] }; }

  if (/clarif|open question|needs? (a )?decision|mismatch|intent/.test(s)) { const xs = idx.filter(x=>x.kind==="clar").sort((a,b)=>({high:0,medium:1,low:2})[a.impact]-({high:0,medium:1,low:2})[b.impact]);
    return { lead:`${xs.length} clarifications — places where the code does something different from its intent. ${xs.filter(x=>x.impact==="high").length} are high impact.`, items:xs.map(askItem), follow:["Which business rules are inconsistent?","What blocks the redesign?"] }; }

  if (/(inconsistent|not enforced|disabled|broken|wrong|defect|bug).*(rule)?|rule.*(inconsistent|not enforced|disabled|broken|wrong)/.test(s) && !/debt/.test(s)) { const xs = idx.filter(x=>x.kind==="rule" && x.st!=="ok");
    return { lead:`${xs.length} of ${RULES.length} business rules are not working as intended: ${["inc","ne","off"].map(k=>`${xs.filter(x=>x.st===k).length} ${R_STAT[k][1].toLowerCase()}`).join(", ")}.`, items:xs.map(askItem), follow:["What are the open clarifications?","What should we fix first?"] }; }

  if (/quick win|fix first|priorit|most important|where (do|should) (we|i) start|biggest risk|top risk/.test(s)) { const xs = idx.filter(x=>x.kind==="debt" && (x.pri==="P1" || x.qw)).slice(0,8);
    return { lead:`Start with the P1 items: security on the revenue path, the Cart & Checkout defects, then quick wins that are cheap to ship. ${xs.filter(x=>x.qw).length} of these are quick wins.`, leadInf:"Ranking from the Technical Debt register — impact, effort and priority are interpretations of the CAST findings.", items:xs.map(askItem), follow: ucHas("plan") ? ["How long will it take?","Which components have critical CVEs?"] : ["Which components have critical CVEs?"] }; }

  if (/how much.*(run|cloud|cost)|run(ning)? cost|cost to run|monthly|per month|cloud (bill|cost)|infrastructure cost/.test(s)) {
    if (planStatus("cost")!=="ready") return { lead:"The running-cost estimate needs customer context first — users, orders, regions, environments and availability.", items:[{kind:"deliv",id:"ctx",title:"Customer Context",text:"Complete the missing inputs to unlock the estimate."}], follow:[] };
    const cl = (typeof tsCloud!=="undefined" && tsCloud) || ctxVal("tgt_cloud") || "Azure", cm = costModel(CSP[cl]?cl:"Azure");
    return { lead:`About <b>${$k((cm.prodMo+cm.npMo))}</b> a month on ${CSP[cl]?.name||cl} (${$k(cm.prodMo)} production, ${$k(cm.npMo)} non-production), and about <b>${$k(cm.annual)}</b> a year including the seasonal peak. Infrastructure only, from public list prices.`, leadInf:"Estimate from the Running Costs model: CAST sizing plus customer answers and list prices.", items:[{kind:"deliv",id:"cost",title:"Estimated Running Costs",text:"Cost by service, peak month, range, sensitivity and assumptions."}], follow:["What's the payback?","When is cutover?"] }; }

  if (/roi|payback|pay back|pays? for itself|business case|saving|net benefit/.test(s)) {
    if (planStatus("roi")!=="ready") return { lead:"The ROI needs today's annual run cost and a few other customer answers first.", items:[{kind:"deliv",id:"ctx",title:"Customer Context",text:"Complete the missing inputs to unlock the ROI."}], follow:[] };
    const r = roiModel(planMode), e = r.S?.expected;
    return e ? { lead:`Expected case: upfront ${$k(e.upfront)}, saving ${$k(e.saveYr)} a year, ${e.pay ? `paying back in about <b>${(e.pay/12).toFixed(1)} years</b>` : "<b>no payback</b> within 5 years"}; 5-year net ${$k(e.net5)}. The conservative case ${r.S.conservative.pay && r.S.conservative.pay<=60 ? `pays back in ${(r.S.conservative.pay/12).toFixed(1)} years` : "does not pay back within 5 years"}.`, leadInf:"ROI model: today's cost (customer), target run cost (list prices) and delivery effort (plan).", items:[{kind:"deliv",id:"roi",title:"Return on Investment",text:"Three scenarios, cash curve and what decides the answer."}], follow:["What would it cost to run?","How long will it take?"] } : null; }

  if (/how long|timeline|duration|effort|person.?weeks|cutover|when (will|can|is)|schedule|team size/.test(s)) {
    if (useCase?.id==="debt") { const pm = planModel(planMode), w = remWps(pm), e = w.reduce((a,x)=>{ const v=pm.eff(x); return [a[0]+v[0],a[1]+v[1]]; },[0,0]).map(v=>v*(1+OVERHEAD));
      return { lead:`The remediation plan has ${w.length} work packages, about ${Math.round(e[0])}–${Math.round(e[1])} person-weeks (${planMode==="ai"?"AI-assisted":"manual"}), finishing around ${fmtD(new Date(Math.max(pm.S.P0[1],pm.S.P1[1])))}.`, leadInf:"Remediation Plan: effort sized from CAST scope counts, +35% overhead.", items:w.slice(0,6).map(x=>askItem(idx.find(i=>i.id===x[0]))), follow:["What should we fix first?"] }; }
    if (planStatus("plan")!=="ready") return { lead:"The plan needs customer context first — style, deadline, budget, team size and skills.", items:[{kind:"deliv",id:"ctx",title:"Customer Context",text:"Complete the missing inputs to unlock the plan."}], follow:[] };
    const pm = planModel(planMode);
    return { lead:`Cutover around <b>${fmtD(pm.cutover)}</b>, with ${Math.round(pm.coreT[0])}–${Math.round(pm.coreT[1])} person-weeks to get there (${planMode==="ai"?"AI-assisted":"manual"} delivery, incl. overhead). Decomposition into services follows after the next peak.`, leadInf:"Modernization Plan: phases and effort sized from CAST scope counts and customer constraints.", items:[{kind:"deliv",id:"plan",title:delivName(DELIV.find(d=>d.id==="plan")),text:"Phases, work packages, Gantt, gates and critical path."}], follow:["What's the payback?","What are the cloud blockers?"] }; }

  if (/blast|impact of (a )?change|what breaks|risky to change|if (i|we) change|change.*(risk|safe)/.test(s)) { const b = Object.values(BLASTS);
    return { lead:`The largest change surfaces are checkout (3,262 objects in its call graph), customer registration (3,072) and catalog updates (2,941). The Technical Diagrams have blast-radius views for ${b.length} code elements: ${b.map(x=>`<code>${esc(x.name)}</code>`).join(", ")}.`, leadEv:["tx","blastTx"], items:[{kind:"deliv",id:"seq",title:"Technical Diagrams",text:"Blast radius (D7): callers by hop and the entry points affected."}], follow:["Which business rules are inconsistent?"] }; }

  if (/block(s|ing)? (the )?redesign|resolve (first|before)/.test(s)) { const ids = ["C-01","C-02","C-03","C-05","C-07","C-09"];
    return { lead:`${ids.length} clarifications sit inside the redesign and must be answered before the rules that replace them can be written.`, items:ids.map(i=>askItem(find(i))), follow:["What changes in the to-be checkout?"] }; }

  if (/to.?be|reimagin|redesign|should become|new process|strangler/.test(s)) { const c = tbCounts();
    return { lead:`The to-be design for Cart & checkout keeps ${c.keep} rules, changes ${c.change}, retires ${c.retire} and adds ${c.add}; ${c.frChange+c.frRetire+c.frNew} requirements change. The new checkout is built behind the existing endpoint and goes live step by step.`, leadInf:"To-be Design: as-is rules from the code, decisions from the customer's redesign goals.", items:idx.filter(x=>x.kind==="tobe" && x.dec!=="keep").slice(0,6).map(askItem), follow:["What blocks the redesign?","What is the new Checkout API?"] }; }

  if (/checkout api|new api|api contract|endpoint/.test(s) && ucHas("tobe")) return { lead:`The new Checkout API keeps <code>${TB_API[0][0]}</code> for the storefront and adds ${TB_API.length-1} new endpoints/events: ${TB_API.slice(1).map(a=>`<code>${esc(a[0])}</code>`).join(", ")}.`, leadInf:"To-be Design · Boundary & API.", items:[{kind:"deliv",id:"tobe",title:"To-be Design",text:"Boundary, API contract and go-live steps."}], follow:["What blocks the redesign?"] };

  if (/target|architecture|which cloud|azure|aws|gcp|google cloud|well.?architected/.test(s)) {
    if (planStatus("target")!=="ready") return { lead:"The target state needs customer context first — hosting today, target cloud and style, drivers, availability and compliance.", items:[{kind:"deliv",id:"ctx",title:"Customer Context",text:"Complete the missing inputs to unlock the target state."}], follow:[] };
    const m = tsModel();
    return { lead:`On ${m.c.name}: ${esc(m.run)} for the API, ${esc(m.c.db)}, ${esc(m.c.cache)} for sessions and cache, ${esc(m.c.obj)} for files, ${esc(m.c.edge)} at the edge. Payments: ${esc(m.payments.join(", "))}.`, leadInf:"Target State model: CAST findings × customer answers × the provider's Well-Architected Framework.", items:[{kind:"deliv",id:"target",title:"Target State Architecture",text:"Diagram, today → target mapping, pillars and ADRs."}], follow:["What would it cost to run?","What are the cloud blockers?"] }; }

  if (/couple|coupling|depend|domain/.test(s)) { const top = [...DLINKS].sort((a,b)=>b[2]-a[2]).slice(0,5);
    return { lead:`The most coupled domain pairs (CAST code links): ${top.map(l=>`${l[0]} → ${l[1]} (${fmt(l[2])})`).join(", ")}.`, leadEv:["domEv"], items:[{kind:"deliv",id:"seq",title:"Technical Diagrams",text:"Domain dependency map (D3) and data ownership (D4)."}], follow:["What's risky to change?"] }; }

  if (/what (is|does) (this|shopizer)\b|what does (the|this) (app|application|system|platform) do|overview|about (this|the) (app|application|system)|describe (the|this) (app|application|system)/.test(s)) return {
    lead:`${SYSTEM.name}: ${SYSTEM.apps.length} applications, ${fmt(TOTAL.loc)} lines of code and ${fmt(TOTAL.objects)} objects, analysed by CAST Imaging on ${SYSTEM.snapshot}. ${SYSTEM.apps.map(a=>`<b>${a.name.replace("Shopizer-","")}</b> — ${a.role} (${a.tech})`).join("; ")}. The backend exposes ${SYSTEM.apps[0].tx} transactions across ${SYSTEM.domains.length} business domains.`,
    leadEv:["stats","tx","tags"], items:[], follow:["What should we fix first?","What's risky to change?","Which business rules need a decision?"] };

  if (/who calls|what calls|caller|called by|calls? to|call graph|call chain/.test(s)) { const m = q.match(/\b([a-z]+[A-Z]\w*|[A-Z]\w*\.[a-z]\w*)\b/), hits = m ? askIndex().filter(x=>x.hay.includes(m[1].toLowerCase())).slice(0,4) : [];
    return { lead:"Callers and call chains of a specific method" + (m ? " like <code>"+esc(m[1])+"</code>" : "") + " come from CAST Imaging's call graph, which this Blueprint only summarises." + (hits.length ? " Here is where it appears in this Blueprint:" : ""), miss:true, items:hits.map(askItem), follow:["What's risky to change?"] }; }

  const hint = /\bstor(y|ies)\b/.test(s) ? ["story"] : /requirement/.test(s) ? ["fr"] : /work package/.test(s) ? ["wp"] : /\bdebt\b/.test(s) ? ["debt"] : /\brules?\b/.test(s) ? ["rule","tobe"] : null;
  const hits = askSearch(q, hint, 6);
  if (hits.length) return { lead:`Here is what this Blueprint has on that — ${hits.length} item${hits.length>1?"s":""}, best match first.`, items:hits.map(askItem), follow:askFollow(hits[0].kind) };
  return { lead:"I couldn't find that in this Blueprint.", miss:true, items:[], follow:askSuggest().slice(0,3) };
}
function askFollow(kind){ return ({ rule:["Which business rules are inconsistent?","What are the open clarifications?"], clar:["Which business rules are inconsistent?"], debt:["What should we fix first?"], oss:["Which CVEs go away without an upgrade?"], wp:["How long will it take?"], tobe:["What blocks the redesign?"] })[kind] || askSuggest().slice(0,2); }
function askSuggest(){
  return ({
    mm:["What are the cloud blockers?","What would it cost to run?","When is cutover?","What's the payback?"],
    debt:["What should we fix first?","Which components have critical CVEs?","Which CVEs go away without an upgrade?","How long will it take?"],
    am:["What does this application do?","Which business rules are inconsistent?","What's risky to change?","What are the open clarifications?"],
    reimag:["What changes in the to-be checkout?","What blocks the redesign?","What is the new Checkout API?","Which business rules are inconsistent?"],
  })[useCase?.id] || ["What does this application do?","How many vulnerabilities are there?","Which business rules are inconsistent?","What's risky to change?"];
}

/* ---------- panel ---------- */
function askRenderAnswer(a){
  const evBtn = ev => ev?.length ? `<button class="src ext" onclick="openEvidence(${JSON.stringify(ev).replace(/"/g,"&quot;")},this)">◆ Imaging</button>` : "";
  const inf = a.leadInf ? `<button class="src inf" onclick="openInferred(${JSON.stringify(a.leadInf).replace(/"/g,"&quot;")},[],this)">◇ Inferred</button>` : "";
  const items = (a.items||[]).filter(Boolean).map(x=>{ const d = x.kind==="deliv" ? x.id : delivOf[x.kind], home = useCase ? askHome(d) : null;
    return `<div class="askitem"><div class="aih"><span class="aik">${K_LABEL[x.kind]}</span>${x.kind!=="deliv"?`<code>${esc(x.id)}</code>`:""}${evBtn(x.ev)}</div>
      <b>${esc(x.title)}</b><p>${esc(x.text.length>220 ? x.text.slice(0,217)+"…" : x.text)}</p>
      <a href="javascript:void 0" onclick="askOpen('${x.kind}','${esc(x.id)}')">Open in ${esc(d ? delivName(DELIV.find(z=>z.id===d)) : "Blueprint")}${home?` <span class="aiuc">· ${esc(home.name)}</span>`:""} →</a></div>`; }).join("");
  const miss = a.miss ? `<p class="askmiss">Questions about code this Blueprint doesn't cover — any method, caller or transaction — will go to CAST Imaging once the chat is connected to the MCP gateway.</p>` : "";
  return `<div class="asklead">${a.lead}${a.leadEv?evBtn(a.leadEv):""}${inf}</div>${items}${miss}
    ${(a.follow||[]).length?`<div class="askchips">${a.follow.map(f=>`<button onclick="askSend(${JSON.stringify(f).replace(/"/g,"&quot;")})">${esc(f)}</button>`).join("")}</div>`:""}`;
}
function askPaint(){
  document.body.classList.toggle("ask-open", ASK.open);
  const p = document.getElementById("askPanel"); if (!p) return;
  const srcs = Object.entries(ASK_SOURCES).map(([k,s])=>`<button class="${ASK.src===k?"on":""}" ${s.ready?`onclick="ASK.src='${k}';askSave();askPaint()"`:"disabled"} title="${esc(s.note)}">${s.label}${s.ready?"":" · soon"}</button>`).join("");
  const empty = `<div class="askempty"><b>Ask about this Blueprint</b><p>Answers come from this Blueprint's content — rules, requirements, clarifications, debt, vulnerabilities, plans and the models behind them — with links to the evidence.</p>
    <div class="askchips">${askSuggest().map(f=>`<button onclick="askSend(${JSON.stringify(f).replace(/"/g,"&quot;")})">${esc(f)}</button>`).join("")}</div></div>`;
  const msgs = ASK.msgs.map(m=> m.role==="user" ? `<div class="askq">${esc(m.text)}</div>` : `<div class="aska">${m.html}</div>`).join("");
  p.querySelector(".asksrc").innerHTML = srcs;
  p.querySelector(".askbody").innerHTML = msgs || empty;
  p.querySelector(".askbody").scrollTop = 1e6;
  document.getElementById("askLaunch").style.display = ASK.open ? "none" : "";
}
function askToggle(open){ ASK.open = open===undefined ? !ASK.open : open; askSave(); askPaint(); if (ASK.open) setTimeout(()=>document.getElementById("askInput")?.focus(), 50); }
function askClear(){ ASK.msgs = []; askSave(); askPaint(); }
async function askSend(text){
  const inp = document.getElementById("askInput"), q = (text ?? inp.value).trim(); if (!q) return;
  inp.value = ""; ASK.open = true; ASK.msgs.push({ role:"user", text:q }); askPaint();
  const src = ASK_SOURCES[ASK.src];
  let a; try { a = await src.answer(q, { useCase: useCase?.id, route }); } catch(e) { a = null; }
  ASK.msgs.push({ role:"bot", html: askRenderAnswer(a || { lead:"Something went wrong answering that.", miss:true, items:[], follow:[] }) });
  askSave(); askPaint();
}
function askKey(e){ if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); askSend(); } }

ctxLoad();
render();
</script>
