<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAST Blueprint — CardDemo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#624ABB; --purple-deep:#463589; --purple-50:#F4F1FC; --purple-100:#E7E1F8; --lavender:#C7C9E0;
  --ink:#0C0613; --text:#212529; --muted:#6D6A71; --line:#E6E4EA; --bg:#FFFFFF; --bg-soft:#FAFAFC;
  --crit:#B42318; --crit-bg:#FEF3F2; --high:#C4320A; --high-bg:#FFF4ED; --med:#B54708; --med-bg:#FFFAEB; --good:#067647; --good-bg:#ECFDF3;
  --inferred:#8A6D00; --inferred-bg:#FFF8DB;
  --radius:12px; --shadow:0 1px 2px rgba(12,6,19,.05),0 4px 16px rgba(12,6,19,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--purple);text-decoration:none}
button{font-family:inherit;cursor:pointer}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.85em}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.brand svg{height:22px;width:auto}
.brand .sep{width:1px;height:24px;background:var(--line)}
.brand .product{font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--purple-50);color:var(--purple-deep);border:1px solid var(--purple-100)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.crumb{font-size:14px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-deep)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple)}
.btn-sm{padding:6px 14px;font-size:13px}

/* ---------- Home ---------- */
.home{max-width:1180px;margin:0 auto;padding:56px 24px 80px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.hero h1{font-size:44px;line-height:1.1;letter-spacing:-.025em;color:var(--ink);margin:12px 0 16px;max-width:820px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--purple)}
.hero p{font-size:18px;color:var(--muted);max-width:700px;margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:40px 0 48px}
.step{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-soft)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;margin-bottom:10px}
.step h4{margin:0 0 4px;color:var(--ink);font-size:16px}
.step p{margin:0;color:var(--muted);font-size:14px}

.syscard{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.syscard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:28px 28px 20px;border-bottom:1px solid var(--line)}
.syscard-head h2{margin:4px 0 6px;font-size:26px;color:var(--ink);letter-spacing:-.015em}
.syscard-head .meta{color:var(--muted);font-size:14px}
.syscard-body{display:grid;grid-template-columns:1.25fr 1fr;gap:0}
.apps{padding:20px 28px 28px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.app{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px}
.app .name{font-weight:700;color:var(--ink)}
.app .tech{font-size:13px;color:var(--muted)}
.app .nums{grid-row:1/3;grid-column:2;display:flex;gap:18px;text-align:right}
.app .nums div{font-size:12px;color:var(--muted)}
.app .nums b{display:block;font-size:16px;color:var(--ink)}
.depgraph{padding:20px 28px;display:flex;flex-direction:column}
.depgraph h5,.apps h5{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.depgraph svg{width:100%;height:auto}

.deliv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.deliv{padding:18px;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:6px;transition:.15s}
.deliv:hover{border-color:var(--purple-100);box-shadow:var(--shadow)}
.deliv h4{margin:0;font-size:15px;color:var(--ink)}
.deliv p{margin:0;font-size:13.5px;color:var(--muted)}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:56px 0 0}
.section-title h3{margin:6px 0 0;font-size:24px;color:var(--ink);letter-spacing:-.01em}

.gtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;width:fit-content;white-space:nowrap}
.gtag.ext{background:var(--purple-50);color:var(--purple-deep)}
.gtag.mix{background:#F2F0F5;color:#4B4652}
.gtag.ctx{background:var(--inferred-bg);color:var(--inferred)}
.gtag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- Workspace ---------- */
.ws{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 64px)}
.side{border-right:1px solid var(--line);background:var(--bg-soft);padding:20px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side .sys{padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side .sys b{display:block;color:var(--ink);font-size:15px}
.side .sys span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--text)}
.navgroup{margin:14px 0 4px;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.navitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer}
.navitem:hover{background:#fff}
.navitem.active{background:#fff;color:var(--purple);box-shadow:inset 3px 0 0 var(--purple),0 1px 2px rgba(12,6,19,.06)}
.status{width:8px;height:8px;border-radius:50%;flex:none}
.status.done{background:var(--good)} .status.ready{background:var(--lavender)} .status.ctx{background:#E5B700}
.legend{margin-top:20px;padding:14px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;align-items:center;gap:8px}

.main{padding:36px 48px 80px;min-width:0}
.doc{max-width:900px;margin:0 auto}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.doc-head h1{margin:6px 0 6px;font-size:34px;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.doc-head .meta{font-size:13.5px;color:var(--muted)}
.doc-actions{display:flex;gap:8px;flex:none}
.doc h2{font-size:20px;color:var(--ink);margin:40px 0 14px;letter-spacing:-.01em}
.doc p{margin:0 0 12px}

.grounding{display:flex;align-items:center;gap:16px;margin:20px 0 8px;padding:14px 18px;border:1px solid var(--purple-100);background:var(--purple-50);border-radius:var(--radius)}
.grounding .bar{flex:1;height:8px;border-radius:99px;background:var(--inferred-bg);overflow:hidden;display:flex}
.grounding .bar i{display:block;height:100%;background:var(--purple)}
.grounding .txt{font-size:13.5px;color:var(--purple-deep)}
.grounding .txt b{font-size:15px}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{padding:16px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--purple)}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--crit);font-weight:600;margin-top:2px}

.bottomline{margin:28px 0 0;padding:22px 24px;border-radius:var(--radius);background:var(--ink);color:#fff;position:relative}
.bottomline .eyebrow{color:#B8A9EE}
.bottomline p{font-size:17px;line-height:1.55;margin:8px 0 0;color:#F1EEF8}

/* statements */
.stmt{position:relative;padding-right:4px}
.stmt .src{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;vertical-align:1px;cursor:pointer;border:none;white-space:nowrap}
.stmt .src.ext{background:var(--purple-50);color:var(--purple-deep)}
.stmt .src.ext:hover{background:var(--purple);color:#fff}
.stmt .src.inf{background:var(--inferred-bg);color:var(--inferred)}
.stmt .src.inf:hover{background:#F2DE8A}
.stmt.hl{background:linear-gradient(transparent 0,var(--purple-50) 0);border-radius:4px;outline:2px solid var(--purple-100);outline-offset:3px}
.bottomline .stmt .src.inf{background:rgba(255,248,219,.15);color:#F5D86B}

.findings{display:flex;flex-direction:column;gap:12px}
.finding{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:92px 1fr;gap:16px}
.sev{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:6px;height:fit-content;text-align:center}
.sev.critical{background:var(--crit-bg);color:var(--crit)} .sev.high{background:var(--high-bg);color:var(--high)} .sev.medium{background:var(--med-bg);color:var(--med)} .sev.strength{background:var(--good-bg);color:var(--good)}
.finding h3{margin:0 0 6px;font-size:16px;color:var(--ink)}
.finding p{margin:0 0 6px;font-size:14.5px}

.score{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.score .cell{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.score .cell .t{font-size:13px;color:var(--muted)}
.score .cell .r{font-size:16px;font-weight:700;color:var(--ink);margin:2px 0 8px}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--purple)}

.recs{counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:start;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius)}
.rec::before{counter-increment:r;content:counter(r);width:30px;height:30px;border-radius:50%;background:var(--purple-50);color:var(--purple);display:grid;place-items:center;font-weight:800}
.rec h4{margin:3px 0 4px;font-size:15.5px;color:var(--ink)}
.rec p{margin:0;font-size:14.5px}
.horizon{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.horizon.now{border-color:var(--purple);color:var(--purple)}

.archfig{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--bg-soft);margin:6px 0 14px}
.archfig svg{width:100%;height:auto;display:block}
.figcap{font-size:12.5px;color:var(--muted);margin-top:8px}

.next-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.next-grid .deliv{cursor:pointer}

/* placeholder */
.ph-hero{margin-top:28px;padding:32px;border:1.5px dashed var(--lavender);border-radius:16px;background:var(--bg-soft);text-align:center}
.ph-hero h3{margin:10px 0 6px;color:var(--ink);font-size:20px}
.ph-hero p{margin:0 auto 18px;color:var(--muted);max-width:560px}
.ph-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.ph-box{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.ph-box h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph-box ul{margin:0;padding-left:18px;font-size:14.5px}
.ph-box li{margin-bottom:6px}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(12,6,19,.25);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(12,6,19,.12);transform:translateX(100%);transition:.25s ease;z-index:90;display:flex;flex-direction:column}
.drawer.open{transform:none}.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer header{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:6px 0 0;font-size:18px;color:var(--ink)}
.drawer .x{position:absolute;right:16px;top:16px;border:none;background:none;font-size:22px;color:var(--muted)}
.drawer .body{padding:18px 22px;overflow:auto;flex:1}
.ev{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.ev .evh{padding:12px 14px;background:var(--bg-soft);border-bottom:1px solid var(--line)}
.ev .evh b{color:var(--ink);font-size:14px}
.ev .call{display:block;margin-top:4px;color:var(--purple-deep);font-size:12px}
.ev table{width:100%;border-collapse:collapse;font-size:13px}
.ev td{padding:7px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.ev tr:last-child td{border-bottom:none}
.ev td:last-child{text-align:right;font-weight:600;color:var(--ink);white-space:nowrap}
.ev td.l{text-align:left;font-weight:500}
.ev .foot{padding:10px 14px;font-size:12.5px;border-top:1px solid var(--line)}
.infnote{padding:14px;border-radius:10px;background:var(--inferred-bg);color:#5C4800;font-size:13.5px;margin-bottom:14px}

/* generate modal */
.modal-bg{position:fixed;inset:0;background:rgba(12,6,19,.45);display:none;place-items:center;z-index:100}
.modal-bg.open{display:grid}
.modal{width:560px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(12,6,19,.3);padding:28px}
.modal h3{margin:6px 0 4px;font-size:22px;color:var(--ink)}
.modal .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.gsteps{display:flex;flex-direction:column;gap:10px}
.gstep{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);transition:.2s}
.gstep .ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;margin-top:1px}
.gstep.active{color:var(--ink)} .gstep.active .ic{border-color:var(--purple);border-top-color:transparent;animation:spin .8s linear infinite}
.gstep.done{color:var(--ink)} .gstep.done .ic{background:var(--purple);border-color:var(--purple);color:#fff}
.gstep small{display:block;color:var(--muted);font-size:12.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:4px;background:var(--purple-50);border-radius:4px;overflow:hidden;margin-top:20px}
.progress i{display:block;height:100%;width:0;background:var(--purple);transition:width .4s}

/* ---------- Application Specification ---------- */
.domainbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 4px}
.domainbar .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.dchip{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.dchip:hover{border-color:var(--purple);color:var(--purple)}
.dchip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.dchip .plus{opacity:.6;margin-left:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 0;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--purple);border-bottom-color:var(--purple)}
.tab.file{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;font-weight:500}
.tab .cnt{display:inline-block;margin-left:6px;font-size:11px;padding:0 6px;border-radius:99px;background:var(--inferred-bg);color:var(--inferred);font-family:Inter,sans-serif;font-weight:700}
.filehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 4px;padding:10px 14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted)}
.filehead code{color:var(--ink);font-size:13px}
.specmeta{font-size:13.5px;color:var(--muted);margin:10px 0 0;line-height:1.8}
.specmeta b{color:var(--ink);font-weight:600}
.story{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.story h3{margin:0 0 6px;font-size:16px;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prio{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--purple-50);color:var(--purple-deep)}
.story .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.story ol{margin:0;padding-left:20px;font-size:14.5px}
.story ol li{margin-bottom:6px}
.gwt b{color:var(--purple-deep);font-weight:700}
.reqs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.req{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
.req:last-child{border-bottom:none}
.req .id{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;font-weight:600;color:var(--purple);padding-top:2px}
.req .trace{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-family:"JetBrains Mono",Consolas,monospace}
mark.nc{background:var(--inferred-bg);color:#6B5300;padding:1px 5px;border-radius:4px;font-size:13.5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
ul.plain{margin:0;padding-left:20px;font-size:14.5px}
ul.plain li{margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg-soft);padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .m{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;font-weight:600;white-space:nowrap}
.tblwrap{overflow-x:auto;border-radius:var(--radius)}
.verb{font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
.verb.GET{background:#ECFDF3;color:#067647}.verb.POST{background:var(--purple-50);color:var(--purple-deep)}.verb.PUT{background:#FFFAEB;color:#B54708}.verb.DELETE{background:#FEF3F2;color:#B42318}
.yes{color:var(--good);font-weight:600}.no{color:var(--muted)}
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cap{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.cap b{display:block;color:var(--ink);font-size:14.5px}
.cap span{font-size:13px;color:var(--muted)}
.cap .n{float:right;font-weight:800;color:var(--purple);font-size:18px}
.flowfig{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--bg-soft)}
.flowfig svg{width:100%;height:auto;display:block}
.entity{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.entity h4{margin:0;padding:12px 16px;background:var(--bg-soft);border-bottom:1px solid var(--line);font-size:15px;color:var(--ink);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.entity h4 code{color:var(--muted);font-weight:500}
.entity .body{padding:12px 16px;font-size:14px}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.col{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;padding:2px 7px;border-radius:5px;background:#F2F0F5;color:#3A3540}
.col.key{background:var(--purple-50);color:var(--purple-deep);font-weight:600}
.col.warn{background:var(--crit-bg);color:var(--crit);font-weight:600}
.clar{border:1px solid #F2DE8A;background:#FFFDF3;border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.clar .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.clar .h code{font-weight:700;color:var(--inferred)}
.clar h4{margin:0;font-size:15.5px;color:var(--ink)}
.clar p{margin:8px 0 0;font-size:14.5px}
.clar .ask{margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff;border:1px dashed #E5C84A;font-size:14px}
.clar .ask b{color:var(--inferred)}
.impact{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.delta-in{display:flex;gap:10px;margin:18px 0}
.delta-in input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14.5px}
.delta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dcol{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.dcol h4{margin:0 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.dcol ul{margin:0;padding-left:18px;font-size:13.5px}
.dcol li{margin-bottom:6px}
.preview-ribbon{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--ink);color:#fff}
.ev pre{margin:0;padding:12px 14px;background:#0C0613;color:#E7E1F8;font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}
.ev .note{padding:10px 14px;font-size:12.5px;background:var(--inferred-bg);color:#5C4800;border-top:1px solid var(--line)}
/* export modal */
.xmodal{width:1000px;max-width:calc(100vw - 32px);height:min(720px,calc(100vh - 48px));background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(12,6,19,.3);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.xmodal header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.xmodal header h3{margin:4px 0 2px;font-size:20px;color:var(--ink)}
.xmodal header p{margin:0;font-size:13.5px;color:var(--muted)}
.xbody{display:grid;grid-template-columns:260px 1fr;min-height:0}
.tree{border-right:1px solid var(--line);padding:14px 10px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;overflow:auto;background:var(--bg-soft)}
.tree div{padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tree div.dir{color:var(--muted);cursor:default}
.tree div.f:hover{background:#fff}
.tree div.on{background:#fff;color:var(--purple);box-shadow:inset 3px 0 0 var(--purple)}
.xpre{margin:0;padding:18px 22px;overflow:auto;font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap}
.xmodal footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.xmodal footer .hint{font-size:13px;color:var(--muted)}
/* ---------- Business Rules ---------- */
.rkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 14px}
.fchip{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer}
.fchip:hover{border-color:var(--purple)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip.warn.on{background:var(--inferred);border-color:var(--inferred)}
.fchip b{font-weight:700;opacity:.6;margin-left:3px}
.rgroup{margin:22px 0 8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rule{display:grid;grid-template-columns:86px 1fr auto;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;align-items:start}
.rule.flag{border-color:#F2DE8A;background:#FFFDF3}
.rule .rid{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;font-weight:600;color:var(--purple);padding-top:2px}
.rule h4{margin:0 0 3px;font-size:15px;color:var(--ink)}
.rule p{margin:0;font-size:14.5px}
.rule .where{margin-top:6px;font-size:12px;color:var(--muted);font-family:"JetBrains Mono",Consolas,monospace}
.rule .links{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.rule .links a{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:#F2F0F5;color:#4B4652;cursor:pointer}
.rule .links a.c{background:var(--inferred-bg);color:var(--inferred)}
.rbadges{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rtype{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.rstat{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.rstat.ok{background:var(--good-bg);color:var(--good)}
.rstat.inc{background:var(--high-bg);color:var(--high)}
.rstat.ne{background:var(--crit-bg);color:var(--crit)}
.rstat.off{background:#F2F0F5;color:#4B4652}
.dtable{margin-bottom:28px}
.dtable h3{font-size:16px;color:var(--ink);margin:0 0 4px}
.dtable .sub{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.tbl td.out{font-weight:600;color:var(--ink)}
.tbl tr.hl td{background:var(--purple-50)}
/* ---------- User Stories ---------- */
.smap{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;margin-top:22px}
.epic{background:var(--ink);color:#fff;border-radius:10px;padding:12px 12px 10px;font-size:13.5px;font-weight:700;line-height:1.3;cursor:pointer}
.epic small{display:block;font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;color:#B8A9EE;font-weight:500;margin-bottom:4px}
.epic .n{display:block;font-size:11.5px;color:#C7C9E0;font-weight:500;margin-top:6px}
.scard{margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--good);border-radius:8px;padding:9px 10px;font-size:13px;line-height:1.35;background:#fff;cursor:pointer;transition:.15s}
.scard:hover{border-color:var(--purple);box-shadow:var(--shadow)}
.scard.issue{border-left-color:#E5B700;background:#FFFDF3}
.scard.idle{border-left-color:var(--lavender);background:var(--bg-soft);color:var(--muted)}
.scard code{display:block;font-size:10.5px;color:var(--purple);margin-bottom:2px}
.slegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.slegend span{display:inline-flex;align-items:center;gap:6px}
.slegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ustory{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;scroll-margin-top:84px}
.ustory.hl{outline:2px solid var(--purple);outline-offset:2px}
.ustory .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ustory h4{margin:2px 0 0;font-size:16px;color:var(--ink)}
.ustory .sid{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;color:var(--purple);font-weight:600}
.asa{margin:10px 0 0;font-size:15px;line-height:1.6}
.asa b{color:var(--purple-deep)}
.smeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.smeta div{background:var(--bg-soft);border-radius:8px;padding:8px 10px;font-size:12.5px}
.smeta div b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.smeta code{font-size:11.5px}
.ac{margin:12px 0 0;padding-left:20px;font-size:14px}
.ac li{margin-bottom:6px}
.ac .rref{font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;color:var(--muted);margin-left:4px}
.sstat{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.sstat.ok{background:var(--good-bg);color:var(--good)}.sstat.issue{background:var(--inferred-bg);color:var(--inferred)}.sstat.idle{background:#F2F0F5;color:#4B4652}
.epichead{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.epichead h3{margin:0;font-size:18px;color:var(--ink)}
.epichead code{color:var(--muted);font-size:12px}
@media (max-width:640px){.smeta{grid-template-columns:1fr}}

/* ---------- Technical Diagrams ---------- */
.vpick{padding:14px 22px 4px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.vl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}
.vchip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;max-width:260px}
.vchip:hover{border-color:var(--purple)}
.vchip b{font-size:13px;color:var(--ink)}
.vchip span{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vchip.on{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple);background:var(--purple-50)}
.vrow2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.vgen{flex:1;min-width:220px;max-width:380px;padding:7px 12px;border:1px dashed var(--lavender);border-radius:8px;font:inherit;font-size:13px;background:#fff}
.vdom{font-size:12.5px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.dcard{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:.15s;background:#fff}
.dcard:hover{border-color:var(--purple)}
.dcard.on{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple);background:var(--purple-50)}
.dcard .num{font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;color:var(--purple);font-weight:600}
.dcard b{display:block;color:var(--ink);font-size:14px;margin:2px 0}
.dcard span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.dcard .scope{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dpanel{margin-top:22px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dpanel .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dpanel .dh h2{margin:2px 0 4px;font-size:20px}
.dpanel .dh .q{font-size:14.5px;color:var(--muted)}
.dpanel .dh .q b{color:var(--ink);font-weight:600}
.collapse{font-size:12.5px;font-weight:600;color:var(--purple-deep);background:var(--purple-50);padding:4px 10px;border-radius:999px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.dbody{padding:18px 22px;background:#fff}
.dbody svg{width:100%;height:auto;display:block}
.mermaid-src{margin:0;padding:18px 22px;background:#0C0613;color:#E7E1F8;font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre;overflow:auto;max-height:560px}
.takeaways{padding:16px 22px 18px;border-top:1px solid var(--line);background:var(--bg-soft)}
.takeaways h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.takeaways ul{margin:0;padding-left:18px;font-size:14.5px}
.takeaways li{margin-bottom:6px}
.chordwrap{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start}
.chordside{border:1px solid var(--line);border-radius:var(--radius);padding:14px;font-size:13px}
.chordside h5{margin:0 0 2px;font-size:15px;color:var(--ink)}
.chordside .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.chordside table{width:100%;border-collapse:collapse}
.chordside td{padding:4px 0;border-bottom:1px solid var(--line)}
.chordside td:last-child{text-align:right;font-weight:600}
.chordside .two{color:var(--high);font-weight:700}
.clegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.clegend i.line{height:3px;border-radius:2px;width:18px}
.crud td.c{text-align:center;font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;font-weight:700;padding:6px 4px}
.crud th.v{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:11.5px;padding:8px 4px;height:120px;vertical-align:bottom}
.crud td.r{color:var(--purple-deep);background:var(--purple-50)}
.crud td.w{color:#fff;background:var(--purple)}
.crud tr.multi td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.crud tr.multi td.w{background:var(--crit)}
.crud td.tn{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;white-space:nowrap}
.blastwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.txlist{font-size:13px}
.txlist h5{margin:0 0 6px;font-size:13px;color:var(--ink)}
.txlist ul{margin:0 0 14px;padding-left:16px}
.txlist li{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;margin-bottom:3px}
.txlist .out li{color:var(--high)}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.igroup{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.igroup h5{margin:0 0 8px;font-size:13px;color:var(--ink);display:flex;justify-content:space-between}
.igroup h5 span{color:var(--muted);font-weight:500;font-size:12px}
.lib{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}
.lib:first-of-type{border-top:none}
.lib code{font-size:11px;color:var(--muted)}
.lib .flag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--crit-bg);color:var(--crit);white-space:nowrap;height:fit-content}
.lib .flag.lic{background:var(--med-bg);color:var(--med)}
@media (max-width:1000px){.dgrid,.igrid{grid-template-columns:1fr 1fr}.chordwrap,.blastwrap{grid-template-columns:1fr}}
@media (max-width:640px){.dgrid,.igrid{grid-template-columns:1fr}}

/* ---------- Technical Debt ---------- */
.heat td.h{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.heat td.d{min-width:170px}
.dbar{display:flex;align-items:center;gap:8px}
.dbar i{display:block;height:10px;border-radius:5px;background:var(--purple)}
.dbar i.hot{background:var(--high)}
.dbar b{font-size:13px;color:var(--ink);min-width:26px}
.rev{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ink);color:#fff;margin-left:6px;letter-spacing:.03em}
.tdi{display:grid;grid-template-columns:62px 1fr auto;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;align-items:start}
.tdi .tid{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;font-weight:600;color:var(--purple);padding-top:2px}
.tdi h4{margin:0 0 4px;font-size:15px;color:var(--ink)}
.tdi p{margin:0 0 4px;font-size:14px}
.tdi .doms{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tdi .doms span{font-size:11.5px;padding:1px 7px;border-radius:5px;background:#F2F0F5;color:#4B4652}
.tdi .doms span.c{background:var(--inferred-bg);color:var(--inferred);font-weight:600;cursor:pointer}
.tdb{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pr{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px}
.pr.P1{background:var(--crit-bg);color:var(--crit)}.pr.P2{background:var(--med-bg);color:var(--med)}.pr.P3{background:#F2F0F5;color:#4B4652}
.qw{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--good-bg);color:var(--good)}
.ie{font-size:11.5px;color:var(--muted);white-space:nowrap}
.matrix{display:grid;grid-template-columns:80px repeat(3,1fr);grid-template-rows:repeat(3,auto) 34px;gap:6px}
.matrix .ax{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.05em}
.mcell{border-radius:10px;padding:10px;min-height:110px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border:1px solid var(--line)}
.mcell.best{background:var(--good-bg);border-color:#ABEFC6}
.mcell.plan{background:var(--purple-50);border-color:var(--purple-100)}
.mcell .lbl{width:100%;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mdot{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;background:#fff;border:1px solid var(--line);cursor:pointer}
.mdot:hover{border-color:var(--purple);color:var(--purple)}
.mdot.P1{border-color:var(--crit);color:var(--crit)}
@media (max-width:640px){.tdi{grid-template-columns:1fr}.tdb{flex-direction:row;align-items:center;flex-wrap:wrap}}

/* ---------- ROI ---------- */
.roiverdict{margin-top:22px;display:grid;grid-template-columns:1fr 220px;gap:0;border-radius:16px;overflow:hidden;background:var(--ink);color:#fff}
.rv-main{padding:24px 28px}
.rv-big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.rv-big b{color:#8EE4B0}
.rv-sub{font-size:15.5px;line-height:1.6;color:#E7E1F8}
.rv-sub b{color:#fff}
.roiverdict .stmt .src.inf{background:rgba(255,248,219,.15);color:#F5D86B}
.rv-range{background:#1D1628;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.rv-range div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#B8A9EE}
.rv-range div b{font-size:20px}
.rv-range .rv-note{font-size:11.5px;color:#9A97A0}
@media (max-width:760px){.roiverdict{grid-template-columns:1fr}}

/* ---------- Modernization Plan ---------- */
.phase{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.phh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--bg-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.phh code{color:var(--purple);font-weight:700}
.phh b{color:var(--ink);font-size:15px}
.phh span{display:block;font-size:13px;color:var(--muted)}
.phh .phd{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.wp{display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.wp:last-child{border-bottom:none}
.wp:hover{background:#FCFBFE}
.wid{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;font-weight:700;color:var(--purple);padding-top:2px}
.wp b{font-size:14px;color:var(--ink)}
.wbasis{font-size:13px;color:var(--text);margin-top:2px}
.wlinks{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.wlinks span{font-size:11px;padding:1px 6px;border-radius:5px;background:#F2F0F5;color:#4B4652;font-family:"JetBrains Mono",Consolas,monospace}
.wlinks span.dep{background:#fff;border:1px dashed var(--line);font-family:Inter,sans-serif}
.wmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.agent{font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:#E0F2F5;color:#0E7490}

<script>
/* =====================================================================
   CONFIG

const PRODUCT = "Blueprint";   // working name — change here
const APP = "CardDemo";

const SHOW_H = "Transactions &amp; Billing";

/* =====================================================================

   ===================================================================== */
const SYSTEM = {
  name: "CardDemo credit card platform",
  snapshot: "Dec 4, 2025",
  apps: [
    { id:"cd", name:"CardDemo-Cobol", role:"Credit card accounts, transactions, billing and authorizations", tech:"COBOL · CICS · JCL / CA-7 · VSAM · DB2 · IMS · MQ · Assembler", loc:48758, objects:1573, links:3544, tx:90, cves:0 },

};
const DOMAIN_BAR = SYSTEM.domains;

/* Evidence registry: every extracted statement points at one or more of these */
const EV = {
  stats: { title:"Application statistics", call:"stats(application=CardDemo-Cobol)", rows:[
      ["Lines of code","48,758"],["Objects / links","1,573 / 3,544"],
      ["Technologies","Assembler · CA-7 · COBOL · CICS · IMS · MQ Series · z/OS JCL · shell · SQL"],
      ["CRUD interactions","select · insert · update · delete"],["Data sensitivity levels","Sensitive Data"]]},
  layers: { title:"Architecture layers", call:"architectural_graph(CardDemo-Cobol, level=layer)", rows:[
      ["Services","374 objects"],["Data Services","148 objects"],["System Interaction","106 objects"],["User Interaction","21 objects"]]},
  progs: { title:"COBOL programs", call:"run_cypher_query — objects of type Cobol Program / Batch / Transactional", rows:[
      ["COBOL programs","42"],["Online (CICS transactional)","26"],["Batch","15"],["Other (CBTRN01C)","1"]]},
  tx: { title:"Transactions (entry points)", call:"transactions(CardDemo-Cobol)", rows:[

      ["Largest online: CC00 sign-on · CCLI card list","170 objects each"],["CAUP account update","162"],["CTLI transaction-type list (DB2)","190"],
      ["POSTTRAN nightly posting","46"],["INTCALC interest","39"],["CREASTMT statements","50"],["TRANREPT report","56"]]},
  schedule: { title:"Nightly batch schedule (CA-7)", call:"run_cypher_query — (CA7 Job)-[:FIRE]->(CA7 Job) · (JCL Job)-[:CALL]->(program)", rows:[

  data: { title:"Data stores and their accessors", call:"run_cypher_query — data objects (VSAM, DB2, IMS, MQ, GDG) with READ/WRITE/SELECT/INSERT/UPDATE/DELETE links", rows:[
      ["VSAM KSDS files","13 (+1 ESDS, 1 RRDS)"],["DB2 tables","TRANSACTION_TYPE · TRANSACTION_TYPE_CATEGORY · AUTHFRDS"],["IMS DB segments","PAUTSUM0 · PAUTINDX"],
      ["MQ queues","CARD.DEMO.ERROR + 3 request/3 reply queues (names resolved at run time)"],
      ["CARDXREF (card ↔ account)","19 accessors"],["ACCTDATA (account master)","17 accessors"],["TRANSACT (CICS)","17 accessors"],["TRANSACTION_TYPE (DB2)","16 accessors"]]},
  crud: { title:"Program → data store access", call:"run_cypher_query — program sub-objects -[READ|WRITE|SELECT|INSERT|UPDATE|DELETE|OPEN]-> data store", rows:[
      ["ACCTDATA written by","COACTUPC (account update) · COBIL00C (bill pay) · CBTRN02C (posting) · CBACT04C (interest)"],
      ["ACCTDATA read by","COACTVWC · COPAUA0C · COPAUS0C · COACCT01 · CBSTM03B · CBACT01C"],
      ["TRANSACT written by","CBTRN02C · COBIL00C · COTRN02C"],["TCATBALF written by","CBTRN02C (read by CBACT04C)"],
      ["CUSTDATA written by","COACTUPC"],["CARDDATA written by","COCRDUPC"],["USRSEC written by","COUSR01C–03C"],["PAUTSUM0 (IMS) written by","COPAUA0C · COPAUS1C · CBPAUP0C"]]},
  nav: { title:"Program-to-program links", call:"run_cypher_query — CALL · EXEC_TRAN (XCTL) · FIRE between programs and CICS transactions", rows:[
      ["Online programs returning to menu / sign-on","21"],["CBSTM03A → CBSTM03B","13 calls (statement subroutine)"],["CSUTLDTC (date validation) called by","COTRN02C · CORPT00C · COACTUPC"],
      ["Main menu → options","resolved at run time from a table (not a static link)"]]},
  iso: { title:"ISO 5055 weaknesses", call:"quality_insights(CardDemo-Cobol, nature=iso-5055)", rows:[
      ["Rules with findings","23"],["Never truncate data in MOVE statements","33 objects"],["High cyclomatic complexity","31"],["CICS return code not checked","25"],
      ["Working-storage read before initialized","22"],["STRING without overflow check","22"],["Large paragraphs","14"],["Unreferenced sections / paragraphs","13"],
      ["Buffer overrun in arithmetic loops","11"],["GOTO statements","10"],["READ without AT END / INVALID KEY","10"],["EVALUATE without WHEN OTHER","8"]]},

/* Statement helpers: X = extracted (grounded in Imaging evidence), I = inferred (LLM interpretation) */
let STMTS = [];
function X(text, ...ev){ STMTS.push({k:"ext"}); return `<span class="stmt">${text}<button class="src ext" onclick="openEvidence(${JSON.stringify(ev).replace(/"/g,"&quot;")},this)">◆ Imaging</button></span>`; }

const fmt = n => n.toLocaleString("en-US");
const TOTAL = { loc:48758, objects:1573, tx:90, cves:0 };

/* Deliverables */
const DELIV = [
  { id:"exec", group:"Understand", name:"Executive Summary", status:"done", g:"mix",
    blurb:"One-page view of the system, its risks and what to do next — for leadership." },
  { id:"spec", group:"Understand", name:"Application Specification", status:"done", g:"ext",
    blurb:"As-is specification per business domain in GitHub Spec Kit format — readable by people, ready for AI coding agents." },
  { id:"rules", group:"Understand", name:"Business Rules", status:"done", g:"mix",
    blurb:"Rules buried in COBOL paragraphs — posting validation, interest, payments — each linked to the paragraph that enforces it, with the inconsistent ones flagged." },
  { id:"stories", group:"Understand", name:"User Stories", status:"done", g:"mix",
    blurb:"Detailed as-is stories per domain — who does what, on which CICS screen or batch job — with acceptance criteria taken from the business rules." },
  { id:"seq", group:"Understand", name:"Technical Diagrams", status:"done", g:"ext",
    blurb:"Eight diagrams — context, containers, domain coupling, data ownership, job and screen flows, lifecycles, blast radius, integrations — condensed from CAST Imaging and exported as Mermaid." },
  { id:"debt", group:"Assess", name:"Technical Debt", status:"done", g:"ext",
    blurb:"Where the debt sits by business domain, a prioritized register, and quick wins separated from structural work." },
  { id:"ctx", group:"Plan", name:"Customer Context", status:"done", g:"cust",
    blurb:"What the code can't tell us — MIPS, batch window, volumes, target direction, drivers, constraints." },
  { id:"target", group:"Plan", name:"Target State Architecture", status:"ctx", g:"ctx",
    blurb:"Target architecture guided by the AWS, Azure and GCP Well-Architected Frameworks and their mainframe modernization patterns.",
    sources:["Current-state analysis — online, batch, data stores","Cloud readiness blockers and boosters","Well-Architected skill","Customer context"], output:["Target diagram","Current → target mapping","Pillar rationale","Decision log"] },
  { id:"cost", group:"Plan", name:"Estimated Running Costs", status:"ctx", g:"ctx",
    blurb:"Run-cost estimate for the target state, by service and environment.",
    sources:["Target State Architecture","Customer context — volumes, environments","Cloud provider pricing"], output:["Monthly run cost by service","Prod / non-prod","Sensitivity","Today vs. target"] },
  { id:"plan", group:"Plan", name:"Modernization Plan", status:"ctx", g:"ctx",
    blurb:"Sequenced roadmap from today to target state — phases, work packages, gates and effort.",

function paintGrounding(){
  const el = document.getElementById("grounding"); if(!el) return;
  const n = k => STMTS.filter(s=>s.k===k).length;
  const ext = n("ext"), inf = n("inf"), cus = n("cust"), fw = n("fw"), pr = n("price"), tot = ext+inf+cus+fw+pr;
  if (!tot) { el.style.display="none"; return; }
  const w = v => Math.round(v/tot*100);
  const parts = [`${ext} extracted`, cus?`${cus} customer-provided`:"", fw?`${fw} framework guidance`:"", pr?`${pr} price list`:"", `${inf} interpreted`].filter(Boolean).join(", ");
  document.getElementById("grounding").innerHTML = `
    <div class="txt"><b>${tot} of ${tot}</b> statements traced to evidence · ${parts}</div>
    <div class="bar"><i style="width:${w(ext)}%"></i>${cus?`<i style="width:${w(cus)}%;background:var(--good)"></i>`:""}${fw?`<i style="width:${w(fw)}%;background:#0E7490"></i>`:""}${pr?`<i style="width:${w(pr)}%;background:#4B4652"></i>`:""}</div>
    <span class="gtag ext">Extracted</span>${cus?'<span class="gtag" style="background:var(--good-bg);color:var(--good)">Customer</span>':""}${fw?'<span class="gtag" style="background:#E0F2F5;color:#0E7490">Framework</span>':""}${pr?'<span class="gtag" style="background:#EDEBF0;color:#4B4652">Price list</span>':""}<span class="gtag ctx">Inferred</span>`;
}

function blastSVG(b){
  const cx=220, cy=220, RS=78; let s = `<svg viewBox="0 0 440 440" font-family="Inter,sans-serif">`;
  b.rings.forEach(([h])=> s += `<circle cx="${cx}" cy="${cy}" r="${h*RS}" fill="none" stroke="#E6E4EA"/><text x="${cx+h*RS-4}" y="${cy-4}" text-anchor="end" font-size="10" fill="#9A97A0">${h===1?"programs":"entry points"}</text>`);
  b.rings.forEach(([h,parts])=>{ const n = parts.reduce((a,x)=>a+x[1],0); let k=0;
    parts.forEach(([d,c])=>{ for(let j=0;j<c;j++){ const a = -Math.PI/2 + (k++ + 0.5)*2*Math.PI/n + h*0.3; s += `<circle cx="${(cx+h*RS*Math.cos(a)).toFixed(1)}" cy="${(cy+h*RS*Math.sin(a)).toFixed(1)}" r="8" fill="${BLAST_COL[d]}" stroke="#fff" stroke-width="1.5"><title>${BLAST_LBL[d]}</title></circle>`; } }); });
  s += `<circle cx="${cx}" cy="${cy}" r="34" fill="#C4320A"/><text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${b.short[0]}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${b.short[1]}</text></svg>`;
  const used = [...new Set(b.rings.flatMap(([,p])=>p.map(x=>x[0])))];
  return `<div class="blastwrap"><div>${s}
    <div class="clegend">${used.map(d=>`<span><i style="background:${BLAST_COL[d]}"></i>${BLAST_LBL[d].replace("&","&amp;")}</span>`).join("")}<span>inner ring = ${b.table?"programs that read or write it":"programs that call it"} · outer ring = entry points</span></div>
    <p style="font-size:12.5px;color:var(--muted)">Focus: <code>${esc(b.name)}</code></p></div>
    <div class="txlist"><h5>Entry points in ${SHOW_H} (${b.inn.length})</h5><ul>${b.inn.map(t=>`<li>${t}</li>`).join("")}</ul>
    ${b.out.length?`<h5 style="color:var(--high)">Outside ${SHOW_H} (${b.out.length})</h5><ul class="out">${b.out.map(t=>`<li>${t}</li>`).join("")}</ul>`:`<h5 style="color:var(--good)">No entry points outside ${SHOW_H}</h5>`}</div></div>`;
}
function blastMermaid(b){
  const L = ["flowchart RL", `  target((${b.name}))`];
  b.rings.forEach(([h,p],i)=>{ const n = p.reduce((a,x)=>a+x[1],0); L.push(`  h${h}[${h===1?"programs":"entry points"} · ${n}<br/>${p.map(x=>BLAST_LBL[x[0]]+" "+x[1]).join(" · ")}] --> ${i?"h"+(h-1):"target"}`); });

  return L.join("\n");
}

  ["TD-03","Reliability","Truncation and overflow in money fields","33 objects truncate data in MOVE statements, 22 build strings without an overflow check and 11 do arithmetic in loops without ON SIZE ERROR — including posting, interest, the report and statements.","Amounts and identifiers can be cut or wrap without an error, exactly where money is calculated.","H","M","P1",false,["TRAN","AUTH"],["iso","flaws"],[]],

let debtView = "where", debtTheme = "All";
function setDebt(v,t){ if(v) debtView=v; if(t!==undefined) debtTheme=t; document.getElementById("doc").innerHTML = techDebt(); paintGrounding(); }
const domLabel = id => ((DOMS.find(d=>d[0]===id)||[id,id])[1]).replace("&","&amp;");

function techDebt(){
  STMTS = []; debtWhere(); debtRegister(true); const all = STMTS; STMTS = [];
  const body = { where:debtWhere, register:()=>debtRegister(false), plan:debtPlan }[debtView]();
  STMTS = all;
  const p1 = DEBT.filter(d=>d[7]==="P1").length, qw = DEBT.filter(d=>d[8]).length;
  return `
  <div class="doc-head"><div><div class="eyebrow">Technical Debt · as-is</div><h1>${APP}</h1>
    <div class="meta">ISO 5055, cloud-readiness, green-IT and structural findings, mapped to 9 business domains · snapshot ${SYSTEM.snapshot}</div></div>
    <div class="doc-actions"><button class="btn btn-primary btn-sm" onclick="openExport(DEBT_FILES,'Debt register','Import the register into Jira or Azure DevOps, or hand the Markdown to an AI agent to plan remediation.')">Export for agents</button>
    <button class="btn btn-ghost btn-sm" onclick="toast('Export is not wired up in this prototype')">Export PDF</button></div></div>
  <div class="rkpis">
    <div class="kpi" onclick="openEvidence(['iso'])"><div class="v">242</div><div class="l">ISO 5055 occurrences</div><div class="s">23 rules · 58 objects</div></div>
    <div class="kpi" onclick="setDebt('register','Cloud readiness')"><div class="v">515</div><div class="l">Cloud-blocker occurrences</div><div class="s">368 objects</div></div>
    <div class="kpi" onclick="openEvidence(['cve'])"><div class="v">—</div><div class="l">Known vulnerabilities</div><div class="s" style="color:var(--inferred)">CVE scan not configured</div></div>
    <div class="kpi" onclick="setDebt('plan')"><div class="v">${qw}</div><div class="l">Quick wins</div><div class="s" style="color:var(--good)">${p1} items are priority 1</div></div>
  </div>
  <div class="grounding" id="grounding"></div>
  <div class="tabs">
    <button class="tab ${debtView==="where"?"on":""}" onclick="setDebt('where')">Where the debt is</button>
    <button class="tab ${debtView==="register"?"on":""}" onclick="setDebt('register')">Debt register <span class="cnt" style="background:#F2F0F5;color:#4B4652">${DEBT.length}</span></button>
    <button class="tab ${debtView==="plan"?"on":""}" onclick="setDebt('plan')">Quick wins vs. structural</button>
  </div>
  ${body}`;
}
function debtWhere(){
  const rows = DEBT_DOMS.map(d=>{ const sz = DOMS.find(x=>x[0]===d[0])[3]; const tot = d[1]+d[2]+d[3]+d[4]; return {id:d[0], q:d[1], g:d[2], s:d[3], c:d[4], rev:d[5], tot, dens: Math.round(tot/sz*10)/10}; }).sort((a,b)=>b.dens-a.dens);
  const max = rows[0].dens;
  return `
  <p style="margin-top:22px">${X("Every finding CAST reports is attached to the paragraph, section or program that carries it; rolling those up to programs and programs to domains shows where the debt sits.","debtDom","insights")}
     ${I("Density — findings per program — is fairer than raw counts because it does not simply reward the biggest domain.","A normalization choice; raw counts are shown alongside.","debtDom")}</p>
  <div class="tblwrap"><table class="tbl heat"><thead><tr><th>Domain</th><th style="text-align:right">Quality</th><th style="text-align:right">Efficiency</th><th style="text-align:right">Structural</th><th style="text-align:right">Cloud</th><th style="text-align:right">Total</th><th>Per program</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${domLabel(r.id)}</b>${r.rev?'<span class="rev">MONEY PATH</span>':""}</td><td class="h">${r.q}</td><td class="h">${r.g}</td><td class="h" style="${r.s>=4?"color:var(--crit);font-weight:700":""}">${r.s}</td><td class="h">${r.c}</td><td class="h"><b>${r.tot}</b></td>
    <td class="d"><div class="dbar"><b>${r.dens}</b><i class="${r.rev&&r.dens>=20?"hot":""}" style="width:${Math.round(r.dens/max*120)}px"></i></div></td></tr>`).join("")}
  </tbody></table></div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:8px">Quality = ISO 5055 weaknesses · Efficiency = green-IT patterns · Structural = structural flaws · Cloud = cloud-readiness blockers. Copybooks, maps and utility jobs are not attributed to a domain.</p>
  <div class="takeaways" style="border:1px solid var(--line);border-radius:var(--radius);margin-top:16px"><h4>What this shows</h4><ul>
    <li>${X("Transaction Types and Accounts &amp; Customers are the densest domains — about 28 and 26 findings per program — driven by two programs: COTRTLIC (44) and COACTUPC (50).","debtDom")}</li>
    <li>${X("Transactions &amp; Billing carries the most findings in absolute terms (225) and 4 of the 11 structural flaws, in posting, interest, the report and statements.","debtDom","flaws")}</li>
    <li>${X("Cloud blockers make up two-thirds of all debt: 515 of 777 occurrences.","insights")}</li>
    <li>${I("Most of that cloud debt is mechanical and handled by conversion tools; the debt that needs people is in the money path — correctness, truncation and unchecked return codes.","Prioritization judgment built on the type of finding, not just its count.","debtDom","iso")}</li>
  </ul></div>`;
}
function debtPlan(){
  const cell = (imp,eff) => DEBT.filter(d=>d[5]===imp&&d[6]===eff).map(d=>`<span class="mdot ${d[7]}" title="${d[2]}" onclick="debtTheme='All';setDebt('register');setTimeout(()=>document.getElementById('td-${d[0]}')?.scrollIntoView({block:'center'}),50)">${d[0]}</span>`).join("");
  const lbl = { "H,S":"Do first", "H,M":"Plan now", "H,L":"Structural programme", "M,S":"Quick wins", "M,M":"Schedule", "L,S":"Opportunistic" };
  const cls = { "H,S":"best", "M,S":"best", "H,M":"plan", "H,L":"plan" };
  const rows = ["H","M","L"].map(imp=>`<div class="ax">${{H:"High",M:"Medium",L:"Low"}[imp]}</div>` + ["S","M","L"].map(eff=>`<div class="mcell ${cls[imp+","+eff]||""}"><span class="lbl">${lbl[imp+","+eff]||""}</span>${cell(imp,eff)}</div>`).join("")).join("");
  const qw = DEBT.filter(d=>d[8]);
  return `
  <p style="margin-top:22px">${I("Placing each item by business impact and remediation effort separates what a team can fix before conversion from what the conversion itself should absorb.","Impact and effort are assessments of the extracted findings.","iso","cloud")}</p>
  <div class="matrix">${rows}<div></div><div class="ax">Small effort</div><div class="ax">Medium effort</div><div class="ax">Large effort</div></div>
  <h2>Quick wins (${qw.length})</h2>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>ID</th><th>Item</th><th>Priority</th><th>Why now</th></tr></thead><tbody>
    ${qw.map(d=>`<tr><td class="m">${d[0]}</td><td><b>${d[2]}</b></td><td><span class="pr ${d[7]}">${d[7]}</span></td><td style="font-size:13.5px">${esc(d[4])}</td></tr>`).join("")}
  </tbody></table></div>
  <p style="font-size:13px;color:var(--muted);margin-top:10px">Cloud-readiness items TD-10 and TD-11 are absorbed by the conversion approach chosen in the Target State Architecture; TD-08 and TD-12 are design decisions, not sprint work.</p>`;
}
function mdDebt(){
  const lvl = {H:"High",M:"Medium",L:"Low"}, efl = {S:"Small",M:"Medium",L:"Large"}, dl = id => (DOMS.find(d=>d[0]===id)||[id,id])[1];
  const L = [`# Technical Debt Register — ${APP} (as-is)`,"",`Generated by CAST ${PRODUCT} from CAST Imaging · snapshot ${SYSTEM.snapshot}`,"","Findings are extracted from CAST Imaging. Impact, effort and priority are an assessment for the team to adjust.",""];
  [...new Set(DEBT.map(d=>d[1]))].forEach(t=>{ L.push(`## ${t}`,"");
    DEBT.filter(d=>d[1]===t).forEach(d=>L.push(`### ${d[0]} — ${d[2]}`,"",`- **Finding**: ${d[3]}`,`- **Why it matters**: ${d[4]}`,`- **Priority**: ${d[7]}${d[8]?" · quick win":""} · Impact ${lvl[d[5]]} · Effort ${efl[d[6]]}`,`- **Domains**: ${d[9].map(dl).join(", ")}${d[11].length?` · **Clarifications**: ${d[11].join(", ")}`:""}`,"")); });
  return L.join("\n");
}
function csvDebt(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`, dl = id => (DOMS.find(d=>d[0]===id)||[id,id])[1];
  const rows = [["Issue Type","Issue key","Summary","Description","Priority","Labels"]];
  DEBT.forEach(d=>rows.push(["Task",d[0],d[2],`${d[3]}\n\nWhy it matters: ${d[4]}\nImpact: ${d[5]} · Effort: ${d[6]}\nDomains: ${d[9].map(dl).join(", ")}`,{P1:"Highest",P2:"High",P3:"Medium"}[d[7]],["tech-debt",d[1].toLowerCase().replace(/ /g,"-"),d[8]?"quick-win":""].filter(Boolean).join(" ")]));
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
const DEBT_FILES = [["debt/technical-debt-register.md", mdDebt],["debt/jira-import.csv", csvDebt]];

function debtRegister(silent){
  if (silent) { DEBT.forEach(debtItem); return ""; }
  const themes = [...new Set(DEBT.map(d=>d[1]))];
  const list = DEBT.filter(d=>debtTheme==="All"||d[1]===debtTheme);
  return `<div class="filters">${["All",...themes].map(t=>`<span class="fchip ${debtTheme===t?"on":""}" onclick="setDebt(null,'${t}')">${t}<b>${t==="All"?DEBT.length:DEBT.filter(d=>d[1]===t).length}</b></span>`).join("")}</div>

}
let CTX = {};
function ctxLoad(){ try { const s = localStorage.getItem(CTX_KEY); if (s) { CTX = JSON.parse(s); return; } } catch(e){} ctxDemo(false); }

function ctxDemo(render=true){ ctxPrefill(); Object.entries(CTX_DEMO).forEach(([k,v])=>{ CTX[k] = { v: JSON.parse(JSON.stringify(v)), src:"customer" }; }); ctxSave(); if(render){ renderWorkspace("ctx"); toast("Demo scenario loaded"); } }

const ctxVal = id => CTX[id]?.v;
const ctxAnswered = id => { const v = ctxVal(id); return Array.isArray(v) ? v.length>0 : !!v; };
function ctxSet(id, opt){
  const f = CTX_FIELDS.find(x=>x[0]===id); const cur = CTX[id] || { v: f[4]==="one"?"":[], src:"customer" };
  if (f[4]==="one") cur.v = cur.v===opt ? "" : opt;
  else if (f[4]==="many") { cur.v = cur.v.includes(opt) ? cur.v.filter(x=>x!==opt) : (opt==="None" ? ["None"] : [...cur.v.filter(x=>x!=="None"), opt]); }
  else if (f[4]==="rank") { cur.v = cur.v.includes(opt) ? cur.v.filter(x=>x!==opt) : cur.v.length<3 ? [...cur.v, opt] : cur.v; }
  cur.src = "customer"; CTX[id] = cur; ctxSave();
  if (id==="tgt_cloud") tsCloud = null;   // target state follows the customer's new choice
  ctxRefresh();
}
function ctxConfirm(id){ CTX[id].src = "customer"; ctxSave(); ctxRefresh(); }
function ctxText(id, val){ CTX[id] = { v: val, src:"customer" }; ctxSave(); ctxSummaryOnly(); }
function ctxRefresh(){ const y = window.scrollY; renderWorkspace("ctx"); window.scrollTo(0,y); }
function ctxSummaryOnly(){ const el = document.getElementById("ctxsum"); if (el) el.innerHTML = ctxSummary(); }

function planStatus(id){ const deps = PLAN_DEPS[id]; const missing = deps.filter(d=>!ctxAnswered(d)); return missing.length===0 ? "ready" : "ctx"; }
function ctxStatus(){ const req = [...new Set(Object.values(PLAN_DEPS).flat())]; return req.every(ctxAnswered) ? "done" : "ctx"; }
function statusOf(x){ if (["target","cost","plan","roi"].includes(x.id)) return planStatus(x.id)==="ready" ? "done" : "ctx"; return PLAN_DEPS[x.id] ? planStatus(x.id) : x.id==="ctx" ? ctxStatus() : x.status; }

function fieldLabel(id){ return CTX_FIELDS.find(f=>f[0]===id)[2]; }
function fmtVal(v){ return Array.isArray(v) ? (v.length? v.join(" · ") : "—") : (v || "—"); }

function C(text, ...fields){ STMTS.push({k:"cust"}); return `<span class="stmt">${text}<button class="src cust" onclick="openCustomer(${JSON.stringify(fields).replace(/"/g,"&quot;")},this)">● Customer</button></span>`; }
function openCustomer(fields, btn){
  highlight(btn);
  document.getElementById("drawerKind").textContent = "Customer-provided";
  document.getElementById("drawerTitle").textContent = "Customer context";
  document.getElementById("drawerBody").innerHTML = `<p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">This statement relies on information supplied by the customer, not on code analysis.</p>` +
    `<div class="ev"><div class="evh"><b>Answers used</b><code class="call">Customer Context · ${new Date().toISOString().slice(0,10)}</code></div><table>${fields.map(f=>`<tr><td class="l">${fieldLabel(f)}</td><td>${esc(fmtVal(ctxVal(f)))}</td></tr>`).join("")}</table>
     <div class="foot"><a href="#" onclick="closeDrawer();go('#/ws/ctx');return false">Edit in Customer Context →</a></div></div>`;
  showDrawer();
}

function ctxField(f){
  const [id,,label,help,type,opts,pre] = f; const st = CTX[id]; const v = st?.v;
  const src = st && ctxAnswered(id) ? st.src : null;
  const badge = src==="detected" ? `<span class="pv det">Detected by CAST</span>` : src==="suggested" ? `<span class="pv sug">Suggested from code</span><button class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:12px" onclick="ctxConfirm('${id}')">Confirm</button>` : src==="customer" ? `<span class="pv cus">Customer</span>` : `<span class="pv none">Not answered</span>`;
  let input = "";
  if (type==="info") input = `<div class="infoval">${esc(v)}</div>`;
  else if (type==="text") input = `<textarea rows="2" oninput="ctxText('${id}',this.value)" placeholder="Optional">${esc(v||"")}</textarea>`;
  else input = `<div class="opts">${opts.map(o=>{ const on = Array.isArray(v) ? v.includes(o) : v===o; const rk = type==="rank" && on ? `<b>${v.indexOf(o)+1}</b>` : "";
      return `<button class="opt ${on?"on":""} ${o===DK?"dk":""}" onclick="ctxSet('${id}','${o.replace(/'/g,"\\'")}')">${rk}${o}</button>`; }).join("")}</div>`;
  const used = Object.entries(PLAN_DEPS).filter(([,d])=>d.includes(id)).map(([k])=>({target:"Target state",cost:"Costs",plan:"Plan"})[k]);
  const why = src==="suggested" && pre?.why ? `<div class="fhelp sugg">${pre.why} <a href="#" onclick="openEvidence(${JSON.stringify(pre.ev).replace(/"/g,"&quot;")});return false">Evidence</a></div>` : "";
  const evl = src==="detected" && pre?.ev ? ` <a href="#" onclick="openEvidence(${JSON.stringify(pre.ev).replace(/"/g,"&quot;")});return false">Evidence</a>` : "";
  return `<div class="cfield ${type==="rank"||type==="many"&&opts.length>5||type==="text"||type==="info"?"wide":""}">
    <div class="fh"><label>${label}</label><span class="fb">${badge}</span></div>
    ${help?`<div class="fhelp">${help}${evl}</div>`:""}${why}
    ${input}
    ${type==="rank" && Array.isArray(v) && v.length ? `<div class="fhelp">Weights the Well-Architected pillars: ${v.map((d,i)=>`<b>${i+1}. ${WAF[d]}</b>`).join(" · ")}</div>` : ""}
    ${used.length?`<div class="used">Feeds: ${used.join(" · ")}</div>`:""}
  </div>`;
}
function ctxSummary(){
  const all = CTX_FIELDS.filter(f=>f[4]!=="info"&&f[4]!=="text");
  const ans = all.filter(f=>ctxAnswered(f[0])).length;
  const counts = { detected:0, suggested:0, customer:0 }; CTX_FIELDS.forEach(f=>{ if (ctxAnswered(f[0])) counts[CTX[f[0]].src]++; });
  const dk = all.filter(f=>ctxVal(f[0])===DK || (Array.isArray(ctxVal(f[0]))&&false)).map(f=>f[2]);
  const pct = Math.round(ans/all.length*100);
  const sec = Object.entries(PLAN_DEPS).map(([k,d])=>{ const n = d.filter(ctxAnswered).length; const ok = n===d.length; const name = DELIV.find(x=>x.id===k).name;
    return `<div class="secrow" onclick="go('#/ws/${k}')"><span class="status ${ok?"ready":"ctx"}"></span><div><b>${name}</b><span>${n} of ${d.length} inputs${ok?" · ready":""}</span></div><span class="go">→</span></div>`; }).join("");
  return `<div class="ring" style="--p:${pct}"><div><b>${pct}%</b><span>answered</span></div></div>
    <div class="provs"><span><i class="det"></i>${counts.detected} detected by CAST</span><span><i class="sug"></i>${counts.suggested} suggested from code</span><span><i class="cus"></i>${counts.customer} from the customer</span></div>
    <h5>Plan sections</h5>${sec}
    ${dk.length?`<h5>Will be assumptions</h5><ul class="assume">${dk.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="ctxDemo()">Load demo scenario</button><button class="btn btn-ghost btn-sm" onclick="ctxClear()">Clear answers</button></div>`;
}

  const web = channels.includes("Web UI for staff"), apis = channels.includes("APIs for partners"), selfsvc = channels.includes("Customer self-service");
  const assumptions = [];
  if (approach==="Undecided") assumptions.push("Approach undecided — automated refactor to Java assumed: the code base is small and the blockers are mechanical.");
  if (!v("rto") || v("rto")===DK) assumptions.push("Recovery targets not provided — assumed RTO 4 h / RPO 15 min.");
  if (!web && !apis) assumptions.push("No new channel selected — 3270 screens reproduced as a web UI with the same fields and flow.");
  assumptions.push("IMS pending-authorization data assumed to move to relational tables; an IMS-compatible runtime is the alternative (TD-12).");
  const tool = replat ? c.cobol : rewrite ? "a rewrite guided by this Blueprint's specs and rules" : c.tool;
  return { cloud, c, approach, replat, rewrite, hybrid, runKind, run, channels, web, apis, selfsvc, comp, keep, drivers, weight, assumptions, tool, avail:v("availability"), skills };
}

const ROI_CUR = {"< $250K":[150000,250000],"$250K–1M":[250000,1000000],"$1M–3M":[1000000,3000000],"> $3M":[3000000,5000000]};
function roiModel(mode){
  const cloud = tsCloud || (CSP[ctxVal("tgt_cloud")] ? ctxVal("tgt_cloud") : "AWS");
  const cm = costModel(cloud), pm = planModel(mode), cur = ROI_CUR[ctxVal("cur_cost")];
  const OPS = 75000; // ~0.5 FTE cloud operations for the new platform — planning assumption
  const runMo = cm.prodMo + cm.npMo + OPS/12, run = [cm.annual*0.8+OPS, cm.annual+OPS, cm.annual*1.4+OPS];
  const deliv = [pm.coreT[0]*RATE, (pm.coreT[0]+pm.coreT[1])/2*RATE, pm.coreT[1]*RATE];
  const monthsTo = Math.max(1, Math.round((pm.cutover - PLAN_START)/(30.4*864e5)));
  const parMonths = Math.max(1, Math.round((pm.cutover - pm.S.P3[0])/(30.4*864e5)));
  const parallel = runMo * parMonths;
  const scen = (curA, runA, upfront) => { const saveMo = (curA - runA)/12, curve = []; let c = 0;
    for (let m = 1; m <= 60; m++) { c += m <= monthsTo ? -upfront/monthsTo : saveMo; curve.push(c); }
    const pay = saveMo > 0 ? monthsTo + Math.ceil(upfront/saveMo) : null;
    return { curA, runA, upfront, saveYr: curA-runA, pay: pay && pay<=60 ? pay : (pay ? pay : null), net3: curve[35], net5: curve[59], roi5: curve[59]/upfront, curve }; };
  const mid = cur ? (cur[0]+cur[1])/2 : null;
  const S = cur ? { conservative: scen(cur[0], run[2], deliv[2]+parallel), expected: scen(mid, run[1], deliv[1]+parallel), optimistic: scen(cur[1], run[0], deliv[0]+parallel) } : null;
  return { cloud, cm, pm, cur, run, deliv, parallel, parMonths, monthsTo, S };
}

function roiCurve(r){
  const W = 900, H = 300, X0 = 60, Y0 = 20, PW = W-X0-20, PH = H-Y0-40;
  const all = Object.values(r.S).flatMap(s=>s.curve), lo = Math.min(0,...all), hi = Math.max(0,...all);
  const x = m => X0 + (m/60)*PW, y = v => Y0 + (hi-v)/(hi-lo)*PH;
  const $m = v => (v<0?"−":"")+"$"+(Math.abs(v)>=1e6 ? (Math.abs(v)/1e6).toFixed(1)+"M" : Math.round(Math.abs(v)/1000)+"K");
  const line = (s,c,w,dash) => `<path d="M${x(0)},${y(0)} ${s.curve.map((v,i)=>`L${x(i+1).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" ${dash?'stroke-dasharray="6 5"':""}/>`;
  let g = `<svg viewBox="0 0 ${W} ${H}" font-family="Inter,sans-serif">`;
  [lo, lo/2, 0, hi/2, hi].forEach(v=>{ g += `<line x1="${X0}" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"#9A97A0":"#F0EEF3"}" stroke-width="${v===0?1.2:1}"/><text x="${X0-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#6D6A71">${$m(v)}</text>`; });
  for (let yr=1; yr<=5; yr++) g += `<line x1="${x(yr*12)}" x2="${x(yr*12)}" y1="${Y0}" y2="${Y0+PH}" stroke="#F0EEF3"/><text x="${x(yr*12)}" y="${H-18}" text-anchor="middle" font-size="10.5" fill="#6D6A71">Year ${yr}</text>`;
  g += `<rect x="${x(0)}" y="${Y0}" width="${x(r.monthsTo)-x(0)}" height="${PH}" fill="#F4F1FC" opacity=".6"/><text x="${x(r.monthsTo/2)}" y="${Y0+14}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#463589">modernization</text>`;
  g += line(r.S.conservative,"#C7C9E0",2,true) + line(r.S.optimistic,"#C7C9E0",2,true) + line(r.S.expected,"#624ABB",3,false);
  const e = r.S.expected; if (e.pay && e.pay<=60) g += `<circle cx="${x(e.pay)}" cy="${y(0)}" r="6" fill="#067647" stroke="#fff" stroke-width="2"/><text x="${x(e.pay)}" y="${y(0)-12}" text-anchor="middle" font-size="11" font-weight="800" fill="#067647">break-even · month ${e.pay}</text>`;
  return g + `</svg>`;
}

function evCard(id){
  const e = EV[id]; if(!e) return "";
  return `<div class="ev"><div class="evh"><b>${e.title}</b><code class="call">${e.call}</code></div>
    ${e.rows ? `<table>${e.rows.map(r=>`<tr><td class="l">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>` : ""}
    ${e.code ? `<pre>${esc(e.code)}</pre>` : ""}
    ${e.note ? `<div class="note">${e.note}</div>` : ""}
    <div class="foot"><a href="#" onclick="toast('Deep link to CAST Imaging — not wired in prototype');return false">Open in CAST Imaging ↗</a></div></div>`;
}
function highlight(btn){ document.querySelectorAll(".stmt.hl").forEach(s=>s.classList.remove("hl")); if(btn) btn.closest(".stmt")?.classList.add("hl"); }
function openEvidence(ids, btn){
  highlight(btn);
  document.getElementById("drawerKind").textContent = "Extracted from CAST Imaging";
  document.getElementById("drawerTitle").textContent = "Evidence";
  document.getElementById("drawerBody").innerHTML = `<p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">This statement is built from deterministic analysis results. Re-running the analysis returns the same values.</p>` + ids.map(evCard).join("");
  showDrawer();
}
function openInferred(basis, ids, btn){
  highlight(btn);
  document.getElementById("drawerKind").textContent = "Inferred";
  document.getElementById("drawerTitle").textContent = "How this was reasoned";
  document.getElementById("drawerBody").innerHTML = `<div class="infnote"><b>Interpretation, not extraction.</b> ${basis}</div>
    <p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">Based on this evidence:</p>` + ids.map(evCard).join("");
  showDrawer();
}
function showDrawer(){ document.getElementById("drawer").classList.add("open"); document.getElementById("drawerBg").classList.add("open"); }
function closeDrawer(silent){ document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerBg").classList.remove("open"); if(!silent) highlight(null); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") { closeDrawer(); closeExport(); } });

let tt; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }
ctxLoad();
render();
</script>
