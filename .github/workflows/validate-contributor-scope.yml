name: Validate contributor scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-scope:
    name: Check changed files are within contributor scope
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve contributor scope
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Keep in sync with CODEOWNERS
          REVIEWERS: "cgufflet obonsignour raghumadhava"
        run: |
          # Reviewers can touch anything (assets/, to_be_validated/, root files)
          for r in $REVIEWERS; do
            if [ "$PR_AUTHOR" = "$r" ]; then
              echo "✅ $PR_AUTHOR is a reviewer — no path restriction"
              exit 0
            fi
          done

          echo "🔍 $PR_AUTHOR is a contributor — checking path scope"

          FAILED=false

          # Get changed file list via git diff (no gh CLI needed)
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # Block secrets and local config anywhere in the PR
            if [[ "$(basename "$file")" == "settings.local.json" ]]; then
              echo "❌ settings.local.json must not be committed: $file"
              FAILED=true
              continue
            fi

            # Block assets/ — only reviewers may modify validated assets
            if [[ "$file" == "assets/"* ]]; then
              echo "❌ File in protected scope: $file"
              echo "   Only reviewers may modify files under assets/."
              echo "   Submit your asset to to_be_validated/ and a reviewer will promote it."
              FAILED=true
              continue
            fi

            # All other files must be under to_be_validated/
            if [[ "$file" != "to_be_validated/"* ]]; then
              echo "❌ File outside allowed scope: $file"
              echo "   Contributors may only modify files under to_be_validated/."
              FAILED=true
            fi
          done <<< "$CHANGED"

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "Fix the issues above and push again."
            exit 1
          fi

          echo "✅ All changed files are within to_be_validated/"
