name: Validate Plugin Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate marketplace.json exists
        run: |
          if [ ! -f ".claude-plugin/marketplace.json" ]; then
            echo "Error: .claude-plugin/marketplace.json not found"
            exit 1
          fi
          echo "✓ marketplace.json found"

      - name: Validate marketplace.json syntax
        run: |
          if ! jq empty .claude-plugin/marketplace.json; then
            echo "Error: Invalid JSON in marketplace.json"
            exit 1
          fi
          echo "✓ marketplace.json is valid JSON"

      - name: Validate plugin.json exists
        run: |
          if [ ! -f "plugins/cast-skills/.claude-plugin/plugin.json" ]; then
            echo "Error: plugins/cast-skills/.claude-plugin/plugin.json not found"
            exit 1
          fi
          echo "✓ plugin.json found"

      - name: Validate plugin.json syntax
        run: |
          if ! jq empty plugins/cast-skills/.claude-plugin/plugin.json; then
            echo "Error: Invalid JSON in plugin.json"
            exit 1
          fi
          echo "✓ plugin.json is valid JSON"

      - name: Check SKILL.md files exist
        run: |
          if [ ! -d "plugins/cast-skills/skills" ]; then
            echo "Warning: skills directory not found (expected for empty plugin)"
          else
            count=$(find plugins/cast-skills/skills -name "SKILL.md" | wc -l)
            echo "✓ Found $count SKILL.md files"
          fi

      - name: Summary
        run: |
          echo "✓ All validation checks passed"
